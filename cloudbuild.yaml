---
options:
    logging: CLOUD_LOGGING_ONLY

steps:
    # Build the image
    - name: "gcr.io/cloud-builders/docker"
      args: ["build", "-t", "asia-southeast1-docker.pkg.dev/scenic-parity-455100-d4/frontend-artifact:$SHORT_SHA", "."]

    # Push the image to artifact registry
    - name: "gcr.io/cloud-builders/docker"
      args: ["push", "asia-southeast1-docker.pkg.dev/scenic-parity-455100-d4/frontend-artifact:$SHORT_SHA"]

    # Apply the artifact to cloud run service
    - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
      entrypoint: gcloud
      args:
          - "run"
          - "deploy"
          - "visionhub"
          - "--image"
          - "asia-southeast1-docker.pkg.dev/scenic-parity-455100-d4/frontend-artifact:$SHORT_SHA"
          - "--region"
          - "asia-southeast1"
          - "--platform"
          - "managed"
          - "--allow-unauthenticated"

images:
    - "asia-southeast1-docker.pkg.dev/scenic-parity-455100-d4/frontend-artifact:$SHORT_SHA"
